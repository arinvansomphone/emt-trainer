services:
  - type: web
    name: emt-trainer
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: SERVICE_DISABLED
        value: "false"
      - key: DAILY_TOKEN_BUDGET
        value: "1500000"
      - key: RATE_LIMIT_PER_MIN
        value: "300"
      - key: VITE_FEEDBACK_URL
        sync: false

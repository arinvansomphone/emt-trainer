services:
  - type: web
    name: emt-trainer
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    disk:
      name: emt-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/emt.db
      - key: OPENAI_API_KEY
        sync: false
      - key: SERVICE_DISABLED
        value: "false"
      - key: DAILY_TOKEN_BUDGET
        value: "1500000"
      - key: RATE_LIMIT_PER_MIN
        value: "300"
      - key: VITE_FEEDBACK_URL
        sync: false
